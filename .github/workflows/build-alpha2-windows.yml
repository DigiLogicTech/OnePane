name: Build OnePane Windows alpha.2

on:
  push:
    branches:
      - build/alpha2-windows
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Restore validated source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src
          base64 -d .build/onepane-alpha2-source.tar.gz.b64 > /tmp/onepane-alpha2-source.tar.gz
          tar -xzf /tmp/onepane-alpha2-source.tar.gz -C src
          echo "Source files: $(find src -type f | wc -l)"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: src/go.sum

      - name: Validate source
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_windows_qa_source.py
          python3 scripts/validate_windows_qa4_source.py
          python3 scripts/validate_windows_qa5_source.py
          go test ./...

      - name: Build Windows x64 backend
        working-directory: src
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/OnePane.Backend.exe ./cmd/harnessd
          sha256sum dist/OnePane.Backend.exe > dist/OnePane.Backend.exe.sha256
          go version -m dist/OnePane.Backend.exe > dist/OnePane.Backend.exe.modules.txt

      - name: Upload backend
        uses: actions/upload-artifact@v4
        with:
          name: OnePane-alpha2-windows-backend
          path: |
            src/dist/OnePane.Backend.exe
            src/dist/OnePane.Backend.exe.sha256
            src/dist/OnePane.Backend.exe.modules.txt
          if-no-files-found: error
          retention-days: 7
