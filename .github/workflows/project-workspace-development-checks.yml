permissions:
  contents: read

jobs:
  physical-readiness-report:
    name: Physical Node approval status (informational only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/project-workspace-development-environments'
    # Uses a hosted runner, never connects to an unapproved self-hosted Node.
    # Shows only whether admin variables exist; never prints their values.
    # A successful report job is NOT physical execution or approval.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record truthful physical QA blockers
        shell: bash
        env:
          ROOTLESS_APPROVED: ${{ vars.ONEPANE_ROOTLESS_SMOKE_IMAGE != '' }}
          GODOT_APPROVED: ${{ vars.ONEPANE_GODOT_SMOKE_IMAGE != '' }}
          PYTHON_APPROVED: ${{ vars.ONEPANE_LARGE_ARTIFACT_SMOKE_IMAGE != '' }}
        run: |
          {
            echo '### RC11 physical Node acceptance — approval-only readiness'
            echo ''
            echo '**No physical acceptance is established by this job.**'
            echo 'Approval variables indicate eligibility to run a self-hosted job, not image validity, OCI runtime readiness, or test success.'
            echo ''
            echo '| Opt-in family | Admin approval configured |'
            echo '| --- | --- |'
            for item in 'Rootless Workspace:ROOTLESS_APPROVED' 'Godot 4:GODOT_APPROVED' 'Python, Library and HTTP Broker:PYTHON_APPROVED'; do
              label="${item%:*}"
              variable="${item#*:}"
              if [[ "${!variable}" == 'true' ]]; then
                state='Configured — physical test must still pass'
              else
                state='Not configured — physical jobs skipped'
              fi
              printf '| %s | %s |\n' "$label" "$state"
            done
            echo ''
            echo 'On the intended unprivileged Node run: `go run ./cmd/onepane-node-preflight`.'
            echo 'Preflight reads only rootless Podman status and approved local image presence. No images are pulled or containers changed.'
          } >> "$GITHUB_STEP_SUMMARY"

  development-contract:
    name: Validate honest Workspace runtime boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Frontend syntax and runtime-boundary contract
        run: |
          node --check internal/webui/static/project-development-page.js
          node --check internal/webui/static/project-task-graphs.js
          node scripts/validate_project_task_graphs_ui.js
          node --check internal/webui/static/workspace-collaboration.js
          node --check internal/webui/static/workspace-library.js
          node scripts/validate_workspace_evidence_ui.js
          node --check internal/webui/static/workspace-runtime-controls.js
          node --check internal/webui/static/workspace-ai-workflow.js
          node --check internal/webui/static/models-page.js
          node scripts/validate_colibri_pin.js
          node --check internal/webui/static/model-agentcheck-diagnostics.js
          node --check internal/webui/static/project-library-route.js
          node --check internal/webui/static/project-workspace-page.js
          node --check internal/webui/static/app-foundation.js
          node --check internal/webui/static/app.js
          node --check internal/webui/static/team-room.js
          node scripts/validate_team_room.js
          node --check internal/webui/static/team-assignments.js
          node scripts/validate_team_assignments.js
          node --check internal/webui/static/task-recovery.js
          node scripts/validate_task_recovery.js
          node --check internal/webui/static/web-chat-page.js
          node --check internal/webui/static/web-chat-session-tabs.js
          node --check internal/webui/static/web-chat-council-launch.js
          node --check internal/webui/static/web-chat-chair.js
          node scripts/validate_web_chair.js
          node scripts/validate_web_only_council.js
          node scripts/validate_web_chat_sessions.js
          node --check internal/webui/static/colibri-spec-sheet.js
          node --check internal/webui/static/colibri-registration-dialog.js
          node scripts/validate_colibri_spec_tour.js
          node scripts/validate_models_qa_rc2.js
          node scripts/validate_unified_assistant_chat.js
          node scripts/validate_l5_goal_lifecycle.js
          node scripts/validate_product_ux_alignment.js
          node --check internal/webui/static/settings-redesign.js
          node --check internal/webui/static/qa-execution-provenance.js
          node scripts/validate_qa_execution_provenance.js
          node --check internal/webui/static/qa-api-capture.js
          node scripts/validate_qa_api_capture.js
          node --check internal/webui/static/qa-reproduction-note.js
          node scripts/validate_qa_reproduction.js
          node --check internal/webui/static/debug-centre.js
          node --check internal/webui/static/qa-trace-correlation.js
          node scripts/validate_qa_trace_correlation.js
          node scripts/validate_debug_centre.js
          node --check internal/webui/static/policy-diagnostic-review.js
          node scripts/validate_policy_diagnostic_review.js
          node scripts/validate_project_development_surface.js
          node scripts/validate_model_agentcheck_residency.js
          node scripts/validate_legacy_cleanup.js
      - name: Existing sandbox and Project contract tests
        run: |
          go test ./internal/runtimecoord ./internal/runtimeendpoint ./internal/agentruntime ./internal/projectworkspace ./internal/projectruntime ./internal/sandboxrunner ./internal/agentprotocol ./internal/agentworker ./internal/team ./internal/teamworker ./internal/task ./internal/storage/sqlite ./internal/scheduler ./internal/localai ./internal/api ./internal/nodepreflight
          go test -tags integration ./internal/agentruntime ./internal/scheduler ./internal/inference ./internal/tool ./internal/projectworkspace ./internal/sandboxrunner ./internal/agentworker ./internal/task ./internal/workspacepublisher ./internal/projectorchestrator ./internal/workspacebroker ./internal/nodefederation ./internal/operation ./internal/goalobserveradapter
      - name: Bounded low-memory L5 observer lifecycle (hosted simulation)
        env:
          GOMEMLIMIT: 256MiB
          GOMAXPROCS: '2'
          GOGC: '50'
        run: |
          # Source/in-memory SQLite acceptance, not physical hardware or
          # a measured peak RSS guarantee. Repeat with fresh Go processes.
          go test -tags integration -count=1 -timeout 3m -run '^(TestObserverPauseResumeRequiresRealCoordinatorApprovalAndCompensation|TestRecurringTCPWorkerRequiresOptInAndPersistsCadenceAcrossRestart)$' ./internal/projectworkspace ./internal/goalobserveradapter
      - name: Persistent SQLite/WAL observer soak (hosted Linux, no sockets)
        env:
          GOMEMLIMIT: 256MiB
          GOMAXPROCS: '2'
          GOGC: '50'
        run: |
          go test -tags integration -count=1 -timeout 5m -run '^TestObserverFenceBoundedRestartWALDurabilitySoak$' -v ./internal/projectworkspace
      - name: Node approval and SQLite race checks (hosted source only)
        run: |
          go test -race -count=1 ./internal/runtimecoord ./internal/teamworker
          go test -race -tags integration -count=1 -timeout 3m -run 'Test(TeamAssignmentsExecute|TeamPause|TeamResume|TeamCancellation|CancellationBetweenWorkerTicks|ProjectTaskGraphRecognizesReviewedTeam)' ./internal/team ./internal/agentworker ./internal/projectorchestrator
          go test -race -tags integration -count=1 -timeout 3m -run 'Test(AgentProtocolHTTPPostDispatch|RuntimeDispatchUnusable)' ./internal/agentruntime
          go test -race -tags integration -count=1 -timeout 3m -run 'Test(UnstartedCancellation|RecoveryCapture|RecoveryDiscovery|RecoveryAdmission|InterruptedRecoveryCannotReadmitOriginalTask|TeamHoldCannotReadmitThroughUnguardedTaskService)' ./internal/task
          go test -race -tags integration -count=1 -timeout 3m -run 'Test(ProposePlanRejects|SyncTaskStates|ReasoningTask|CompleteReasoningTurn|ReasoningTurn|ManualCouncilTaskFences|ResearchSeatVerifiedTextDelivery)' ./internal/team ./internal/teamworker
          go test -race -count=1 ./internal/instrumentprobe ./internal/nodefederation ./cmd/onepane-node-custody ./cmd/onepane-instrument-probe
          go test -race -tags integration -count=1 -run TestHumanApprovedNodeExecutionPermitIsOneChallengeOnly ./internal/projectworkspace
      - name: Managed inference lease and Colibri rollback race tests (hosted Linux)
        env:
          GOMEMLIMIT: 256MiB
          GOMAXPROCS: '2'
        run: |
          # No live model or GPU. Real SQLite-backed concurrent lease tests.
          go test -race -count=1 -timeout 3m -run TestManagedStop ./internal/localai
          go test -race -count=1 -timeout 3m -run TestColibriRollbackCanStopWhileHoldingResidencyLock ./internal/localai
          go test -race -count=1 -timeout 3m -run TestChatColibriReplacementCancelledAfterEvictionRestoresPreviousWithIndependentDeadline ./internal/localai
          go test -race -count=1 -timeout 3m -run TestColibriRollbackCannotClaimAnUnverifiedRestoredModel ./internal/localai
          go test -race -count=1 -timeout 3m -run TestColibriTargetCannotAdvertiseUnpersistedSuccessfulStart ./internal/localai
          go test -race -count=1 -timeout 3m -run TestColibriReplacementDoesNotGuessRollbackWhenTargetPIDUnknown ./internal/localai
          go test -race -count=1 -timeout 3m -run TestChatColibriUsesSameFailClosedSwapAsExplicitControl ./internal/localai
          go test -race -count=1 -timeout 3m -run 'Test(DirectColibriStart|ColibriHotSwapStatusShows)' ./internal/localai
          go test -race -count=1 -timeout 3m -run TestCancelledColibriSwap ./internal/localai
          go test -race -count=1 -timeout 3m -run TestColibriReplacement ./internal/localai
          go test -race -count=1 -timeout 3m -run TestColibriHotSwapRejectsLiveFailedAndStoppedEngineBeforeEviction ./internal/localai
          go test -race -count=1 -timeout 3m -run TestColibriFailedRowWithConfirmedDeadPIDDoesNotBlockSwap ./internal/localai
          go test -race -count=1 -timeout 3m -run TestUnrecordedModel ./internal/localai
          go test -race -count=1 -timeout 3m -run TestFailedModelPIDPersistence ./internal/localai
          go test -race -count=1 -timeout 3m -run '^TestManagedProcessIdentity' ./internal/localai
          go test -race -count=1 -timeout 3m -run '^TestManagedTrackedProcess' ./internal/localai
          go test -race -count=1 -timeout 3m -run '^(TestRecoveredModel|TestRecovery|TestManagedRuntimeRecovery)' ./internal/localai
          go test -race -count=1 -timeout 3m -run TestManagedStartup ./internal/localai
          go test -race -count=1 -timeout 3m -run TestCancelledUnlaunchedModel ./internal/localai
          go test -race -count=1 -timeout 3m -run TestUnlaunchedModel ./internal/localai
          go test -race -count=1 -timeout 3m -run TestManagedLauncherCancellationPreflight ./internal/localai
          go test -race -count=1 -timeout 3m -run TestManagedMemoryAdmission ./internal/localai
          go test -race -count=1 -timeout 3m -run 'TestManaged(HealthyOrBusyUnknownPIDNeverSilentlyStops|MemoryAdmissionPreservesUnknownHealthyBusyOwners|RuntimeRestartRequiresReconciliationForLiveNonRunningProcess)' ./internal/localai
          go test -race -count=1 -timeout 3m -run 'TestManaged(Stopped|StopDoesNotErase|MemoryAdmissionRejectsUnproven)' ./internal/localai
          go test -race -count=1 -timeout 3m -run 'TestColibri(ReplacementUnknownResult|ConfirmedNoChildFailure)' ./internal/localai
          go test -race -count=1 -timeout 3m -run TestColibriUnknownStoppedOrFailedPID ./internal/localai
          go test -race -count=1 -timeout 3m -run TestColibriHealthyBusyWithoutPIDCannotClaimSafeEviction ./internal/localai
      - name: Full Go regression and cross-platform compilation
        run: |
          go test ./internal/featurepolicy ./internal/inference ./internal/tool ./internal/webui
          go test ./...
          # Exercise a real pre-config, pre-HTTP backend failure and the
          # offline-only reader without a running OnePane API or database.
          go build -o /tmp/onepane-qa-bootstrap ./cmd/harnessd
          evidence_root="$(mktemp -d)"
          if ONEPANE_STARTUP_EVIDENCE_ROOT="$evidence_root" /tmp/onepane-qa-bootstrap -config "$evidence_root/nonexistent.yaml" >/dev/null 2>&1; then
            echo "Deliberately invalid configuration unexpectedly passed"
            exit 1
          fi
          /tmp/onepane-qa-bootstrap -startup-evidence-root "$evidence_root" |
            node -e 'let data="";process.stdin.on("data",x=>data+=x).on("end",()=>{
              const events=JSON.parse(data);
              if(!events.some(e=>e.schema===1 && e.component==="backend" &&
                 e.stage==="configuration" && e.outcome==="failed"))process.exit(1);
              for(const e of events){
                if(Object.keys(e).some(k=>!["schema","at_utc","component","stage","outcome"].includes(k)))
                  process.exit(2);
              }
            })'
          rm -rf -- "$evidence_root"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/onepane-node-preflight.exe ./cmd/onepane-node-preflight
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/onepane-node-custody.exe ./cmd/onepane-node-custody
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/onepane-instrument-probe.exe ./cmd/onepane-instrument-probe
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/onepane-harnessd.exe ./cmd/harnessd
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/onepane-service.exe ./packaging/windows/service
          # Compile the legacy setup source without a real distributable payload.
          # No installer is packaged or released by this compilation check.
          mkdir -p packaging/windows/setup/payload
          printf 'CI compile fixture' > packaging/windows/setup/payload/qa-compile-fixture.bin
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/onepane-legacy-setup.exe ./packaging/windows/setup
          bash -n scripts/install-ubuntu.sh

  offline-msi-evidence:
    name: Validate Windows instance lock and offline MSI evidence
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Native Windows LockFileEx ownership and crash-recovery regressions
        shell: pwsh
        run: |
          # Native Windows (not cross-compilation): verifies LockFileEx denial
          # for a competing backend, stale lock-file reuse, unsafe paths, and
          # OS-held lock release after forcibly killing a holder process.
          # Hosted test only; does not assert installed Windows SCM readiness.
          go test -count=1 -timeout 3m ./internal/processlock
      - name: Native Windows backend authenticated service-control regressions
        shell: pwsh
        run: |
          # Validate readiness/shutdown credentials on the actual target OS.
          # The server is NOT installed or launched by this unit check.
          go test -count=1 -timeout 3m ./cmd/harnessd ./internal/serviceproof
      - name: Native Windows managed-model environment and private-log regressions
        shell: pwsh
        run: |
          # Real Windows process-launch credential isolation and NTFS ACL tests.
          # No Colibri downloads, installs, or user data root access.
          go test -count=1 -timeout 4m -run TestManagedRuntimeLaunchWithNilOrEmptyEnvDoesNotInheritSecrets ./internal/localai
          go test -count=1 -timeout 4m -run TestWindowsManagedRuntimeLog ./internal/localai
          # Verify exact launched-model PID ownership and cancelled Colibri
          # compensation on Windows rather than relying on cross-compilation.
          go test -count=1 -timeout 4m -run TestUnrecordedModel ./internal/localai
          go test -count=1 -timeout 4m -run TestFailedModelPIDPersistence ./internal/localai
          go test -count=1 -timeout 4m -run '^TestManagedProcessIdentity' ./internal/localai
          go test -count=1 -timeout 4m -run '^TestManagedTrackedProcess' ./internal/localai
          go test -count=1 -timeout 4m -run TestWindowsTreeSignalNeverExecutesOnUntrackedPID ./internal/localai
          go test -count=1 -timeout 4m -run TestManagedStopRechecksPIDAfterDrainingPersistenceBeforeSIGTERM ./internal/localai
          go test -count=1 -timeout 4m -run '^(TestManagedStopRetainsUnknownProcessOwnershipWithoutPID|TestManagedShutdownCannotSilentlyStopUnknownPIDStartingOrDrain|TestManagedRestartNoChildFailureProofIsRequired|TestConfirmedPrelaunchFailureWithNoPIDStillAllowsExplicitStop|TestRecordedZeroPIDCannotImpersonateProvenNoChildFailure)$' ./internal/localai
          go test -count=1 -timeout 4m -run '^(TestRecoveredModel|TestRecovery|TestManagedRuntimeRecovery)' ./internal/localai
          go test -count=1 -timeout 4m -run TestManagedStartup ./internal/localai
          go test -count=1 -timeout 4m -run TestCancelledUnlaunchedModel ./internal/localai
          go test -count=1 -timeout 4m -run TestUnlaunchedModel ./internal/localai
          go test -count=1 -timeout 4m -run TestCancelledColibriSwap ./internal/localai
          go test -count=1 -timeout 4m -run TestColibriHotSwapRejectsLiveFailedAndStoppedEngineBeforeEviction ./internal/localai
          go test -count=1 -timeout 4m -run TestColibriFailedRowWithConfirmedDeadPIDDoesNotBlockSwap ./internal/localai
          go test -count=1 -timeout 4m -run TestChatColibriReplacementCancelledAfterEvictionRestoresPreviousWithIndependentDeadline ./internal/localai
          go test -count=1 -timeout 4m -run TestColibriRollbackCannotClaimAnUnverifiedRestoredModel ./internal/localai
          go test -count=1 -timeout 4m -run TestColibriTargetCannotAdvertiseUnpersistedSuccessfulStart ./internal/localai
          go test -count=1 -timeout 4m -run TestColibriReplacementDoesNotGuessRollbackWhenTargetPIDUnknown ./internal/localai
          go test -count=1 -timeout 4m -run 'TestColibri(StarterCannot|VerifiedStarter|VerifiedReplacement|VerifiedTarget)' ./internal/localai
          go test -count=1 -timeout 4m -run 'Test(DirectColibriStart|ColibriHotSwapStatusShows)' ./internal/localai
          # OS-backed post-restart PID liveness: live untracked child must
          # block memory admission; dead child must not. Identity stays denied.
          go test -count=1 -timeout 4m -run TestWindowsUntrackedPID ./internal/localai
          go test -count=1 -timeout 4m -run TestManagedMemoryAdmission ./internal/localai
          go test -count=1 -timeout 4m -run 'TestManaged(HealthyOrBusyUnknownPIDNeverSilentlyStops|MemoryAdmissionPreservesUnknownHealthyBusyOwners|RuntimeRestartRequiresReconciliationForLiveNonRunningProcess)' ./internal/localai
          go test -count=1 -timeout 4m -run 'TestManaged(Stopped|StopDoesNotErase|MemoryAdmissionRejectsUnproven)' ./internal/localai
          go test -count=1 -timeout 4m -run 'TestColibri(ReplacementUnknownResult|ConfirmedNoChildFailure)' ./internal/localai
          go test -count=1 -timeout 4m -run TestColibriUnknownStoppedOrFailedPID ./internal/localai
          go test -count=1 -timeout 4m -run TestColibriHealthyBusyWithoutPIDCannotClaimSafeEviction ./internal/localai
      - name: Native Windows SQLite migration and startup-evidence regressions
        shell: pwsh
        run: |
          # Exercise actual Windows filesystem and SQLite behavior on hosted
          # Windows. Does not replace a populated RC10->RC11 installer upgrade
          # or verify persistence on the operator's selected data drive.
          go test -count=1 -timeout 5m ./internal/storage/sqlite ./internal/startupevidence
      - name: Native Windows live Team history and authorization
        shell: pwsh
        run: |
          go test -count=1 -timeout 3m -run 'Test(TeamMessagePage|LiveTeamRoom|TeamLiveRoom|TeamRoundAndReplyScope)' ./internal/team ./internal/api
      - name: Native Windows bootstrap-key privacy and identity preservation
        shell: pwsh
        run: |
          go test -count=1 -timeout 3m ./internal/privatekeyfile ./internal/node ./internal/vault
      - name: Native Windows shared Team compute admission and cancellation
        shell: pwsh
        run: |
          go test -count=1 -timeout 3m ./internal/runtimecoord
          go test -count=1 -timeout 3m -run TestTeamDispatchShares ./internal/teamworker
          go test -count=1 -timeout 3m -run TestTeamAuthorityRechecked ./internal/inference
          go test -count=1 -timeout 3m -run 'Test(RecoveryCaseReads|AcceptedTeamAssignments|TeamAssignment|TeamPause|TeamResume|TeamCancellation)' ./internal/team ./internal/tool ./internal/api
          go test -tags integration -count=1 -timeout 3m -run 'Test(TeamAssignmentsExecute|TeamPause|TeamCancellation|CancellationBetweenWorkerTicks|ProjectTaskGraphRecognizesReviewedTeam)' ./internal/agentworker ./internal/projectorchestrator
          go test -tags integration -count=1 -timeout 3m -run 'Test(AgentProtocolHTTPPostDispatch|RuntimeDispatchUnusable)' ./internal/agentruntime
