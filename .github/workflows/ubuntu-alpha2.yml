name: Alpha 2 Ubuntu Build

on:
  push:
    branches:
      - alpha2-integration
    paths:
      - 'bootstrap/current/**'
      - '.github/workflows/ubuntu-alpha2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Alpha 2 source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Restore authoritative Alpha 2 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p buildsrc
          cat bootstrap/current/alpha2-current.b64.part-* > alpha2-source.b64
          base64 -d alpha2-source.b64 > alpha2-source.tar.xz
          echo "55c5cdc688129f3038ff5ce71da7e70b41040a11bbb6c62db0c4040a2c1fc13c  alpha2-source.tar.xz" | sha256sum -c -
          tar -xJf alpha2-source.tar.xz -C buildsrc
          test -f buildsrc/go.mod
      - name: Validate source and tests
        working-directory: buildsrc
        shell: bash
        run: |
          set -euo pipefail
          node --check internal/webui/static/app.js
          python scripts/validate_live_follow_workspace.py
          python scripts/validate_workspace_components_v2.py
          python scripts/validate_m23_webgui.py
          python scripts/validate_m24_install.py
          python scripts/validate_m25_local_ai_install.py
          go mod download
          go mod verify
          go test ./...

  package:
    name: Ubuntu ${{ matrix.arch }} package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Restore authoritative Alpha 2 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p buildsrc
          cat bootstrap/current/alpha2-current.b64.part-* > alpha2-source.b64
          base64 -d alpha2-source.b64 > alpha2-source.tar.xz
          echo "55c5cdc688129f3038ff5ce71da7e70b41040a11bbb6c62db0c4040a2c1fc13c  alpha2-source.tar.xz" | sha256sum -c -
          tar -xJf alpha2-source.tar.xz -C buildsrc
          cp LICENSE buildsrc/LICENSE
          if [ -f NOTICE ]; then cp NOTICE buildsrc/NOTICE; fi
      - name: Build Debian package
        shell: bash
        env:
          ONEPANE_VERSION: 0.1.0-alpha.2
          ONEPANE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bash buildsrc/scripts/build-ubuntu-deb.sh
          dpkg-deb --info buildsrc/dist/ubuntu/*.deb
          dpkg-deb --contents buildsrc/dist/ubuntu/*.deb | head -100
      - name: Upload Ubuntu package
        uses: actions/upload-artifact@v4
        with:
          name: OnePane-v0.1.0-alpha.2-ubuntu-${{ matrix.arch }}
          path: |
            buildsrc/dist/ubuntu/*.deb
            buildsrc/dist/ubuntu/*.deb.sha256
          if-no-files-found: error
          retention-days: 14