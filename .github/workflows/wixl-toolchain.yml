name: Linux wixl Toolchain Probe

# Packaging experiment only: this job must never be interpreted as proof of
# a working production Windows MSI, Windows service or safe upgrade lifecycle.
on:
  pull_request:
    paths:
      - 'packaging/wixl/**'
      - '.github/workflows/wixl-toolchain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wixl-smoke:
    name: Ubuntu wixl MSI construction + extraction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build disposable wixl toolchain and inspect test MSI
        shell: bash
        run: bash packaging/wixl/run-container.sh OnePane
      - name: Confirm test-only artifact and no release output
        shell: bash
        run: |
          set -euo pipefail
          test -s build/wixl-toolchain-probe/OnePane-WIXL-TOOLCHAIN-PROBE-NOT-FOR-INSTALL.msi
          echo "wixl/msitools toolchain probe completed; this does NOT validate the OnePane Windows installer"
