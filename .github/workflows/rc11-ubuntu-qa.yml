name: RC11 reviewed Ubuntu QA candidate

on:
  pull_request:
    paths:
      - '.github/workflows/rc11-ubuntu-qa.yml'
      - 'scripts/build-rc11-ubuntu-qa.js'
      - 'scripts/test_rc11_ubuntu_qa_guard.js'
      - 'scripts/build-ubuntu-deb.sh'
      - 'packaging/debian/**'
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: Full source SHA after final code security UI review and Windows installed acceptance
        required: true
        type: string
      operator_confirmation:
        description: Type AUTHORIZE_RC11_UBUNTU_QA
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  source-guard:
    name: Validate Ubuntu QA guards without building or installing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/build-rc11-ubuntu-qa.js
      - run: node scripts/test_rc11_ubuntu_qa_guard.js
      - name: Parse every Debian builder and lifecycle hook
        run: |
          for script in scripts/build-ubuntu-deb.sh packaging/debian/preinst packaging/debian/postinst packaging/debian/prerm packaging/debian/postrm; do
            bash -n "$script"
          done

  package:
    name: Assemble exact reviewed Ubuntu amd64 QA candidate
    needs: source-guard
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_commit_sha == github.sha && inputs.operator_confirmation == 'AUTHORIZE_RC11_UBUNTU_QA' && vars.ONEPANE_UBUNTU_QA_REVIEWED_SHA == github.sha }}
    runs-on: ubuntu-24.04
    environment: rc11-ubuntu-qa-approval
    timeout-minutes: 30
    env:
      ONEPANE_EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
      ONEPANE_OPERATOR_CONFIRMATION: ${{ inputs.operator_confirmation }}
      ONEPANE_UBUNTU_QA_REVIEWED_SHA: ${{ vars.ONEPANE_UBUNTU_QA_REVIEWED_SHA }}
      ONEPANE_UBUNTU_QA_APPROVAL_SHA: ${{ vars.ONEPANE_UBUNTU_QA_APPROVAL_SHA }}
      ONEPANE_UBUNTU_QA_APPROVAL_REFERENCE: ${{ vars.ONEPANE_UBUNTU_QA_APPROVAL_REFERENCE }}
      ONEPANE_WINDOWS_QA_ACCEPTED_SHA: ${{ vars.ONEPANE_WINDOWS_QA_ACCEPTED_SHA }}
      ONEPANE_WINDOWS_QA_ACCEPTANCE_REFERENCE: ${{ vars.ONEPANE_WINDOWS_QA_ACCEPTANCE_REFERENCE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse absent exact-source review and Windows acceptance before build tools
        run: node scripts/build-rc11-ubuntu-qa.js --check-only
      - name: Require latest exact-source authoritative integration CI
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'project-workspace-development-checks.yml',
              head_sha: context.sha,
              per_page: 100
            });
            const run = response.data.workflow_runs.filter(r => r.head_sha === context.sha).sort((a,b) => b.id-a.id)[0];
            if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
              throw new Error('Latest exact-source authoritative integration CI has not passed');
            }
            core.exportVariable('ONEPANE_SOURCE_CI_SHA', run.head_sha);
            core.exportVariable('ONEPANE_SOURCE_CI_STATUS', run.status);
            core.exportVariable('ONEPANE_SOURCE_CI_CONCLUSION', run.conclusion);
            core.exportVariable('ONEPANE_SOURCE_CI_RUN_ID', String(run.id));
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Build current source and inspect package provenance without installation
        run: node scripts/build-rc11-ubuntu-qa.js
      - uses: actions/upload-artifact@v4
        with:
          name: OnePane-RC11-Ubuntu-QA-${{ github.sha }}
          path: |
            ${{ runner.temp }}/onepane-ubuntu-rc11-qa/*.deb
            ${{ runner.temp }}/onepane-ubuntu-rc11-qa/*.sha256
            ${{ runner.temp }}/onepane-ubuntu-rc11-qa/SHA256SUMS
            ${{ runner.temp }}/onepane-ubuntu-rc11-qa/candidate-manifest.json
            ${{ runner.temp }}/onepane-ubuntu-rc11-qa/QA-README.txt
          if-no-files-found: error
          retention-days: 14
