name: Normalize OnePane alpha.2 modules

on:
  push:
    branches:
      - build/alpha2-windows
  workflow_dispatch:

permissions:
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore alpha.2 source
        shell: bash
        run: |
          mkdir -p src
          base64 -d .build/onepane-alpha2-source.tar.gz.b64 > /tmp/onepane-alpha2.tar.gz
          tar -xzf /tmp/onepane-alpha2.tar.gz -C src
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: src/go.sum
      - name: Normalize module files
        working-directory: src
        run: go mod tidy
      - name: Upload normalized files
        uses: actions/upload-artifact@v4
        with:
          name: OnePane-alpha2-normalized-modules
          path: |
            src/go.mod
            src/go.sum
          retention-days: 3
