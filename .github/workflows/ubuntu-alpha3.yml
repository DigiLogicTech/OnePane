name: Alpha 3 Ubuntu Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Alpha 3 source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Restore and verify authoritative Alpha 3 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p buildsrc
          git fetch origin alpha2-integration --depth=1
          git show FETCH_HEAD:.recovery/alpha2-buildsrc-current.b64 > alpha2-buildsrc-current.b64
          base64 -d alpha2-buildsrc-current.b64 > alpha2-source.tar.xz
          tar -xJf alpha2-source.tar.xz -C buildsrc
          cat .recovery/alpha3/source-patch/part-*.patch > alpha3-source.patch
          test "$(wc -l < alpha3-source.patch)" -eq 4599
          echo "44e31c4bc6df048acec092629a61feaa86c5bde6d31346ead653cf65b9a3f17d  alpha3-source.patch" | sha256sum -c -
          git apply --check --directory=buildsrc alpha3-source.patch
          git apply --directory=buildsrc alpha3-source.patch
          if compgen -G '.recovery/alpha3/fixes/*.patch' > /dev/null; then
            for fix in .recovery/alpha3/fixes/*.patch; do
              git apply --check --directory=buildsrc "$fix"
              git apply --directory=buildsrc "$fix"
            done
          fi
          test -f buildsrc/go.mod
      - name: Validate source and tests
        working-directory: buildsrc
        shell: bash
        run: |
          set -euo pipefail
          node --check internal/webui/static/app.js
          python scripts/validate_alpha3_source.py
          python scripts/validate_live_follow_workspace.py
          python scripts/validate_workspace_components_v2.py
          python scripts/validate_m23_webgui.py
          python scripts/validate_m24_install.py
          python scripts/validate_m25_local_ai_install.py
          python scripts/validate_m33_node_federation.py
          python scripts/validate_m34_remote_models.py
          python scripts/validate_m35_hardware_testbed.py
          go mod download
          go mod verify
          go test ./...

  package:
    name: Ubuntu ${{ matrix.arch }} package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Restore and verify authoritative Alpha 3 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p buildsrc
          git fetch origin alpha2-integration --depth=1
          git show FETCH_HEAD:.recovery/alpha2-buildsrc-current.b64 > alpha2-buildsrc-current.b64
          base64 -d alpha2-buildsrc-current.b64 > alpha2-source.tar.xz
          tar -xJf alpha2-source.tar.xz -C buildsrc
          cat .recovery/alpha3/source-patch/part-*.patch > alpha3-source.patch
          test "$(wc -l < alpha3-source.patch)" -eq 4599
          echo "44e31c4bc6df048acec092629a61feaa86c5bde6d31346ead653cf65b9a3f17d  alpha3-source.patch" | sha256sum -c -
          git apply --check --directory=buildsrc alpha3-source.patch
          git apply --directory=buildsrc alpha3-source.patch
          if compgen -G '.recovery/alpha3/fixes/*.patch' > /dev/null; then
            for fix in .recovery/alpha3/fixes/*.patch; do
              git apply --check --directory=buildsrc "$fix"
              git apply --directory=buildsrc "$fix"
            done
          fi
          cp LICENSE buildsrc/LICENSE
          if [ -f NOTICE ]; then cp NOTICE buildsrc/NOTICE; fi
      - name: Build Debian package
        shell: bash
        env:
          ONEPANE_VERSION: 0.1.0-alpha.3
          ONEPANE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bash buildsrc/scripts/build-ubuntu-deb.sh
          dpkg-deb --info buildsrc/dist/ubuntu/*.deb
          dpkg-deb --contents buildsrc/dist/ubuntu/*.deb | head -100
      - name: Upload Ubuntu package
        uses: actions/upload-artifact@v4
        with:
          name: OnePane-v0.1.0-alpha.3-ubuntu-${{ matrix.arch }}
          path: |
            buildsrc/dist/ubuntu/*.deb
            buildsrc/dist/ubuntu/*.deb.sha256
          if-no-files-found: error
          retention-days: 14
